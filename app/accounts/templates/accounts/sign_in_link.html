{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Confirm sign-in" %}{% endblock %}

{% block content %}
<h1>{% translate "Confirm sign-in" %}</h1>
<p>{% translate "Opening the link does not sign you in. Confirm below to do so." %}</p>
<form method="post" action="{% url 'accounts:sign-in-link' token %}">
  {% csrf_token %}
  <button type="submit">{% translate "Sign in" %}</button>
</form>
{% endblock %}
