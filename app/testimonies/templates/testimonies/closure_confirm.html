{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Confirm the closure" %}{% endblock %}

{% block content %}
<h1>{% translate "Confirm the closure" %}</h1>
<p>{% translate "Opening the link does not close anything. Confirm below to do so." %}</p>
<form method="post" action="{% url 'testimonies:close-confirm' token %}">
  {% csrf_token %}
  <button type="submit">{% translate "Close my account" %}</button>
</form>
{% endblock %}
