[project]
name = "the-artificial-intelligence-guestbook"
version = "0.1.0"
description = "A human time capsule of the AI era: first-person testimonies, archived as editions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bagit>=1.9.0",
    "django~=5.2",
    "dnspython>=2.9.2",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.3.0",
    "nh3>=0.3.8",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
# Line length is left to ruff format (AGENTS.md: no column limit).
# Optional text is NULL, not an empty string (data model, section 1.2).
ignore = ["E501", "DJ001", "DJ008"]
# DJ008: no admin site or log output prints model instances, so no __str__ is needed.

[tool.pytest.ini_options]
pythonpath = ["app"]
DJANGO_SETTINGS_MODULE = "guestbook.settings_test"
testpaths = ["app"]
addopts = "--strict-markers -ra"
